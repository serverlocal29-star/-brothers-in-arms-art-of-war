name: Publish game launcher and embedded Java ME runtime
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'biatouchsc_8vr9ermj.jar'
      - 'README.md'
      - 'original-port/**'
      - 'game/**'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test native resource readers
        run: node --test original-port/*.test.mjs
      - name: Build self-hosted FreeJ2ME runtime and direct game package
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/zb3/freej2me-web.git /tmp/freej2me-web
          mkdir -p site/emulator/apps
          cp -R /tmp/freej2me-web/web/. site/emulator/
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, base64
          root = Path('.')
          app = Path('/tmp/bia-app')
          (app/'config').mkdir(parents=True, exist_ok=True)
          (app/'rms').mkdir(parents=True, exist_ok=True)
          (app/'app.jar').write_bytes((root/'biatouchsc_8vr9ermj.jar').read_bytes())
          (app/'name').write_text('Brothers in Arms Art of War', encoding='utf-8')
          icon = base64.b64decode('')
          (app/'icon').write_bytes(icon)
          (app/'rms'/'BIA3').write_bytes(base64.b64decode('AAIAAgABANUAAAEBAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='))
          (app/'config'/'settings.conf').write_text('queuedPaint:off\nrotate:on\ntextureDisableFilter:off\nphone:Nokia\ndgFormat:4444\nsound:on\nwidth:352\nfps:20\nforceFullscreen:on\nfontSize:0\nheight:416\n', encoding='utf-8')
          (app/'config'/'appproperties.conf').write_text('MIDlet-Vendor:Gameloft SA\nMIDlet-Version:1.0.1\nCreated-By:1.4.2 (Sun Microsystems Inc.)\nManifest-Version:1.0\nMIDlet-Icon:/icon.png\nMicroEdition-Configuration:CLDC-1.0\nMIDlet-1:Brothers in Arms Art of War, /icon.png, GloftBIAH\nMIDlet-Name:Brothers in Arms Art of War\nMicroEdition-Profile:MIDP-2.0\n', encoding='utf-8')
          (app/'config'/'systemproperties.conf').write_text('', encoding='utf-8')
          with zipfile.ZipFile('site/emulator/apps/8vr9ermj.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in app.rglob('*'):
                  if p.is_file(): z.write(p, p.relative_to(app).as_posix())
          PY
          # Run the game directly; remove emulator keypad overlays so the game's own touch UI remains visible.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site/emulator/run.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('</style>', '<style>html,body{width:100%;height:100%;overflow:hidden;background:#000;overscroll-behavior:none;touch-action:manipulation}#display{touch-action:none;image-rendering:pixelated}#left-keys,#right-keys{z-index:5;touch-action:manipulation}.key{min-width:36px;min-height:36px;touch-action:manipulation}</style>')
          p.write_text(s, encoding='utf-8')
          PY
          # Extract the real game icon from the original MIDlet JAR for the launcher.
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import shutil
          jar = Path('biatouchsc_8vr9ermj.jar')
          out = Path('site/assets/images/game-icon.png')
          out.parent.mkdir(parents=True, exist_ok=True)
          with ZipFile(jar) as z:
              names = z.namelist()
              candidates = [n for n in names if Path(n).name.lower() in ('icon.png','icon.gif','icon.jpg','icon.jpeg')]
              if not candidates:
                  candidates = [n for n in names if n.lower().endswith('.png') and ('icon' in Path(n).name.lower() or 'logo' in Path(n).name.lower())]
              if candidates:
                  selected = candidates[0]
                  suffix = Path(selected).suffix.lower()
                  out = out.with_suffix(suffix)
                  out.write_bytes(z.read(selected))
                  print(f'Launcher icon extracted from {selected} -> {out}')
              else:
                  print('No standalone icon found in JAR; keep existing launcher artwork fallback')
          PY
          # Publish the launcher alongside the emulator runtime.
          cp index.html site/index.html
          if [ -f site/assets/images/game-icon.png ]; then sed -i 's#./assets/images/favicon.svg#./assets/images/game-icon.png#' site/index.html; fi
          cp -R assets site/assets
          cp biatouchsc_8vr9ermj.jar site/
          cp README.md site/
          if [ -d original-port ]; then cp -R original-port site/; fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
