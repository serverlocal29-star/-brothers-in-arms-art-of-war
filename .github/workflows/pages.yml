name: Publish STAR launcher
on:
  workflow_dispatch:
  push:
    branches: [main, star-web-port]
    paths:
      - 'index.html'
      - 'README.md'
      - '.gitmodules'
      - '.github/workflows/pages.yml'
      - 'emulator/**'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify emulator entrypoint
        run: test -f emulator/web/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
